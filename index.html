<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, awed, observatory-grade; the universe talks, the UI whispers
   IDEA: a planetarium console — dark dome, glowing bodies, a field-guide card per object
   PICTURE: full-bleed live 3D sky; Sun, planets, nearby stars, Milky Way, Andromeda
   COLOUR and TYPE: deep space #04060d, starlight ink #e8ecf5, solar accent #ffb347; Space Grotesk
   LAYOUT: canvas fills screen; top bar of views; right card (bottom sheet under 700px) */
:root{color-scheme:dark;--bg:#04060d;--ink:#e8ecf5;--dim:#9aa4b8;--acc:#ffb347;--panel:rgba(10,14,26,.86);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Space Grotesk",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c:active{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,10px);font-size:13px;color:var(--ink);opacity:.85;white-space:nowrap;pointer-events:auto;cursor:pointer;padding:2px 6px;border-radius:6px;text-shadow:0 1px 3px #000}
.lb:hover,.lb.on{background:rgba(255,179,71,.18);color:#fff;opacity:1}
.lb.star{color:#cfe0ff}.lb.gal{color:#e6c8ff}
header{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px max(2vw,12px);background:linear-gradient(#04060dee,#04060d00);pointer-events:none}
header>*{pointer-events:auto}
h1{font-size:20px;font-weight:700;margin:0 12px 0 0;letter-spacing:.2px}
h1 span{color:var(--acc)}
button,select{font:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer}
button:hover,select:hover{background:rgba(255,255,255,.14)}
button.on{background:var(--acc);color:#1a1000;border-color:var(--acc)}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select option{background:#0b0f1c}
.grp{display:flex;gap:6px;flex-wrap:wrap}
#ctl{position:fixed;left:max(2vw,12px);bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;backdrop-filter:blur(8px)}
#ctl{flex-direction:column;align-items:stretch;max-width:min(560px,calc(100vw - 24px))}
#ctl .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#clock{display:flex;align-items:center;gap:10px;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#live{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#ff4d4d;color:#fff}
#live.off{background:rgba(255,255,255,.12);color:var(--dim)}
input[type=datetime-local]{font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 8px;color-scheme:dark}
#ilive{margin-bottom:6px}#ilive td:last-child{color:#ffd79a}
.sub{font-size:13px;color:var(--acc);margin:14px 0 4px}
.frow{display:flex;gap:6px;margin:6px 0}.frow>select,.frow>input{flex:1}
#ll{font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 10px}
#ilinks{display:grid;gap:6px}
.lb.sat{color:#9fffd0;font-size:12px}
#srch{display:flex;gap:6px;flex:1 1 280px;max-width:460px}
#q{flex:1;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 12px}
#q:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#gmap{width:100%;aspect-ratio:1;border:0;border-radius:14px;display:block;background:#0b0f1c}
#results .ev{cursor:pointer}#results:empty{display:none}
#photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block;background:#000}
#sky{position:fixed;inset:0;background:#02040a;z-index:20;display:flex;flex-direction:column;padding:12px max(2vw,12px)}#sky[hidden]{display:none}
.skyhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.skyhead>div{flex:1;font-size:17px}
#skyc{flex:1;width:100%;min-height:0;display:block}#skyx{width:44px;padding:0;font-size:22px}
.ev{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev b{display:block;font-size:15px}.ev span{color:var(--dim)}.ev button{flex:none;min-height:36px}
.pass{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.lb.loc{color:#ff8a8a;font-weight:700}
#info{position:fixed;top:70px;right:max(2vw,12px);bottom:14px;width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;overflow-y:auto;backdrop-filter:blur(10px);transform:translateX(120%);transition:transform .35s ease}
#info.open{transform:none}
#info h2{font-size:32px;line-height:1.05;margin:0 0 2px}
#info .kind{color:var(--acc);font-size:14px;margin:0 0 12px}
#close{position:absolute;top:12px;right:12px;min-height:40px;width:40px;padding:0;font-size:20px}
#pic{width:100%;aspect-ratio:1;display:block;border-radius:14px;background:#000}
.cap{font-size:13px;color:var(--dim);margin:6px 0 14px}
#info table{width:100%;border-collapse:collapse;font-size:14px}
#info td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
#info td:first-child{color:var(--dim);width:42%}
#info td:last-child{text-align:right}
#info p{font-size:15px;margin:14px 0}
.real{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:10px;background:var(--acc);color:#1a1000;font-weight:700;text-decoration:none;margin-top:6px}
.real.alt{background:rgba(255,255,255,.08);color:var(--ink);font-weight:500;border:1px solid var(--line)}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:15px;color:var(--dim);transition:opacity 1s;pointer-events:none;text-align:center}
@media(max-width:700px){
  h1{font-size:17px;width:100%}
  #info{top:auto;left:8px;right:8px;width:auto;bottom:8px;max-height:62vh;transform:translateY(110%)}
  #info.open{transform:none}
  #ctl{left:8px;right:8px;bottom:8px;max-width:none}
  #info.open~#ctl{display:none}
  #clock{font-size:15px}
}
@media(prefers-reduced-motion:reduce){#info{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<header>
  <h1>Interactive <span>Galaxy</span></h1>
  <div class="grp" role="group" aria-label="Views">
    <button data-v="solar" class="on">Solar system</button>
    <button data-v="stars">Nearby stars</button>
    <button data-v="galaxy">Milky Way</button>
  </div>
  <form id="srch" role="search"><input id="q" type="search" placeholder="Search an address, place or planet…" aria-label="Search an address, place or planet" autocomplete="street-address"><button>Go</button></form>
  <select id="goto" aria-label="Go to object"><option value="">Go to…</option></select>
  <button id="skyb">Sky view</button>
  <button id="evb">Events</button>
</header>
<div id="hint">Live positions for right now · drag to orbit · scroll to zoom · click anything glowing</div>
<aside id="info" aria-live="polite">
  <button id="close" aria-label="Close">×</button>
  <h2 id="iname"></h2>
  <div class="kind" id="ikind"></div>
  <div id="mapbox" hidden>
    <iframe id="gmap" title="Google Maps view of this location" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    <div class="frow"><button data-mt="k" class="on">Satellite</button><button data-mt="m">Map</button><button data-mt="h">Hybrid</button></div>
  </div>
  <div id="results"></div>
  <img id="photo" alt="" hidden>
  <canvas id="pic" width="480" height="480"></canvas>
  <div class="cap" id="piccap">Rendered portrait from this model. Tap below for real telescope and spacecraft photos.</div>
  <div class="sub" id="ilivecap">Right now (at the time shown)</div>
  <table id="ilive"></table>
  <div class="sub">Facts</div>
  <table id="ifacts"></table>
  <div id="earthx" hidden>
    <div class="sub">Fly to a place on Earth</div>
    <div class="frow"><select id="place" aria-label="Choose a place"></select><button id="flyp">Fly</button></div>
    <div class="frow"><input id="ll" placeholder="Address, place, or lat, lon" aria-label="Address, place, or latitude and longitude"><button id="flyll">Go</button></div>
    <div class="frow"><button id="myloc">Use my location</button><button id="skyhere">Sky view from here</button></div>
    <div id="llerr" class="cap"></div>
    <div id="imgx" hidden><div class="sub">Earth imagery</div><div class="frow"><button data-img="map">Map</button><button data-img="bm">Blue Marble</button><button data-img="yday">Yesterday from space</button></div></div>
  </div>
  <div id="extra"></div>
  <p id="idesc"></p>
  <div id="ilinks"></div>
</aside>
<div id="sky" hidden role="dialog" aria-label="Sky view">
  <div class="skyhead"><div><b>Sky above <span id="skyloc"></span></b><div id="skysub" class="cap" style="margin:2px 0 0"></div></div>
  <button id="skyme">Use my location</button><button id="skyx" aria-label="Close sky view">×</button></div>
  <canvas id="skyc"></canvas>
</div>
<div id="ctl">
  <div id="clock"><span id="live">LIVE</span><span id="when"></span></div>
  <div class="row">
    <button id="rev" aria-label="Run time backwards" title="Reverse">⏪</button>
    <button id="pause" aria-label="Pause">❚❚</button>
    <select id="rate" aria-label="Time speed">
      <option value="1">Real time</option><option value="60">1 min / sec</option><option value="3600">1 hour / sec</option>
      <option value="86400">1 day / sec</option><option value="604800">1 week / sec</option><option value="2629800">1 month / sec</option><option value="31557600">1 year / sec</option>
    </select>
    <button id="now" class="on">Now</button>
    <input id="pick" type="datetime-local" aria-label="Jump to date and time">
  </div>
  <div class="row">
    <button id="orb" class="on">Orbits</button>
    <button id="lab" class="on">Labels</button>
    <button id="lights" class="on">City lights</button>
  </div>
  <div id="feeds" class="cap" style="margin:0"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const NASA=s=>'https://science.nasa.gov/'+s;
const WIKI=s=>'https://en.wikipedia.org/wiki/'+s;
const IMG=q=>'https://images.nasa.gov/search?q='+encodeURIComponent(q)+'&media=image';

/* ---------- data ---------- */
const BODIES=[
 {id:'sun',name:'Sun',kind:'G-type main-sequence star (G2V)',r:10,tex:'sun',
  facts:[['Diameter','1,391,000 km'],['Age','~4.6 billion years'],['Surface temp','~5,500 °C'],['Core temp','~15 million °C'],['Share of Solar System mass','99.86%'],['Light to reach Earth','8 min 20 s']],
  desc:'A nearly perfect sphere of hot plasma that fuses about 600 million tonnes of hydrogen into helium every second. Its gravity holds everything in the Solar System together.',
  real:NASA('sun/'),wiki:'Sun',q:'sun solar dynamics observatory'},
 {id:'mercury',name:'Mercury',kind:'Terrestrial planet',r:.8,a:22,P:88,tex:'mercury',tilt:.03,rot:58.6,
  facts:[['Diameter','4,879 km'],['Distance from Sun','0.39 AU'],['Year','88 Earth days'],['Day (sidereal)','58.6 Earth days'],['Moons','0'],['Temperature','−173 to 427 °C']],
  desc:'The smallest planet and the closest to the Sun. With almost no atmosphere to hold heat, it swings between scorching days and frigid nights.',
  real:NASA('mercury/'),wiki:'Mercury_(planet)',q:'mercury messenger'},
 {id:'venus',name:'Venus',kind:'Terrestrial planet',r:1.6,a:30,P:224.7,tex:'venus',tilt:3.1,rot:-243,
  facts:[['Diameter','12,104 km'],['Distance from Sun','0.72 AU'],['Year','225 Earth days'],['Day (sidereal)','243 Earth days, backwards'],['Moons','0'],['Surface temp','~464 °C']],
  desc:'The hottest planet, wrapped in thick clouds of sulfuric acid over a crushing carbon-dioxide atmosphere. It spins backwards, so the Sun rises in the west.',
  real:NASA('venus/'),wiki:'Venus',q:'venus mariner'},
 {id:'earth',name:'Earth',kind:'Terrestrial planet — home',r:1.7,a:39,P:365.25,tex:'earth',tilt:.41,rot:1,clouds:true,
  facts:[['Diameter','12,742 km'],['Distance from Sun','1 AU (149.6 million km)'],['Year','365.25 days'],['Day','23 h 56 min'],['Moons','1'],['Average temp','~15 °C']],
  desc:'The only world known to host life. About 71% of its surface is covered by liquid water, and its magnetic field shields it from the solar wind.',
  real:NASA('earth/'),wiki:'Earth',q:'blue marble earth'},
 {id:'moon',name:'The Moon',kind:'Natural satellite of Earth',r:.45,parent:'earth',a:8,P:27.3,tex:'moon',rot:27.3,
  facts:[['Diameter','3,474 km'],['Distance from Earth','384,400 km'],['Orbit','27.3 days'],['Rotation','Tidally locked'],['Temperature','−173 to 127 °C'],['People who walked on it','12']],
  desc:'Probably formed from debris after a Mars-sized body hit the young Earth. Its gravity drives our ocean tides, and it always shows us the same face.',
  real:NASA('moon/'),wiki:'Moon',q:'moon apollo full moon'},
 {id:'mars',name:'Mars',kind:'Terrestrial planet',r:1.1,a:50,P:687,tex:'mars',tilt:.44,rot:1.03,
  facts:[['Diameter','6,779 km'],['Distance from Sun','1.52 AU'],['Year','687 Earth days'],['Day','24 h 37 min'],['Moons','2 (Phobos, Deimos)'],['Average temp','~−65 °C']],
  desc:'The Red Planet owes its colour to iron oxide dust. It hosts Olympus Mons, the tallest volcano in the Solar System, and Valles Marineris, a canyon as long as the USA.',
  real:NASA('mars/'),wiki:'Mars',q:'mars globe'},
 {id:'jupiter',name:'Jupiter',kind:'Gas giant',r:5.5,a:80,P:4333,tex:'jupiter',tilt:.05,rot:.41,
  facts:[['Diameter','139,820 km'],['Distance from Sun','5.2 AU'],['Year','11.9 Earth years'],['Day','9 h 56 min'],['Moons','95+ known'],['Cloud-top temp','~−110 °C']],
  desc:'The largest planet — more than twice the mass of all the others combined. Its Great Red Spot is a storm wider than Earth that has raged for centuries.',
  real:NASA('jupiter/'),wiki:'Jupiter',q:'jupiter juno'},
 {id:'saturn',name:'Saturn',kind:'Gas giant',r:4.6,a:110,P:10759,tex:'saturn',tilt:.47,rot:.44,ring:true,
  facts:[['Diameter','116,460 km'],['Distance from Sun','9.5 AU'],['Year','29.4 Earth years'],['Day','10 h 33 min'],['Moons','274 known'],['Cloud-top temp','~−140 °C']],
  desc:'Famous for its spectacular rings of ice and rock, up to 280,000 km wide but often only about 10 m thick. Saturn is less dense than water.',
  real:NASA('saturn/'),wiki:'Saturn',q:'saturn cassini'},
 {id:'uranus',name:'Uranus',kind:'Ice giant',r:2.8,a:140,P:30687,tex:'uranus',tilt:1.71,rot:-.72,
  facts:[['Diameter','50,724 km'],['Distance from Sun','19.2 AU'],['Year','84 Earth years'],['Day','17 h 14 min'],['Axial tilt','~98°'],['Cloud-top temp','~−195 °C']],
  desc:'Rolls around the Sun on its side, likely after an ancient collision. Methane in its atmosphere gives it a pale cyan colour.',
  real:NASA('uranus/'),wiki:'Uranus',q:'uranus voyager'},
 {id:'neptune',name:'Neptune',kind:'Ice giant',r:2.7,a:165,P:60190,tex:'neptune',tilt:.49,rot:.67,
  facts:[['Diameter','49,244 km'],['Distance from Sun','30.1 AU'],['Year','165 Earth years'],['Day','16 h 6 min'],['Moons','16 known'],['Cloud-top temp','~−200 °C']],
  desc:'The windiest world: supersonic winds reach about 2,000 km/h. It was the first planet found by mathematical prediction rather than observation.',
  real:NASA('neptune/'),wiki:'Neptune',q:'neptune voyager 2'},
 {id:'pluto',name:'Pluto',kind:'Dwarf planet (Kuiper Belt)',r:.55,a:190,P:90560,tex:'pluto',tilt:2.1,rot:-6.4,incl:.3,
  facts:[['Diameter','2,377 km'],['Average distance','39.5 AU'],['Year','248 Earth years'],['Day','6.4 Earth days'],['Moons','5 (largest: Charon)'],['Temperature','~−230 °C']],
  desc:'Reclassified as a dwarf planet in 2006. NASA’s New Horizons flew past in 2015 and revealed a heart-shaped plain of nitrogen ice called Tombaugh Regio.',
  real:NASA('dwarf-planets/pluto/'),wiki:'Pluto',q:'pluto new horizons'},
];
const STARS=[
 {id:'proxima',name:'Proxima Centauri',kind:'Red dwarf (M5.5V)',col:'#ff7a4a',sz:60,ly:4.24,dir:[.6,-.25,.75],
  facts:[['Distance','4.24 light-years'],['Mass','0.12 × Sun'],['Surface temp','~3,000 °C'],['Brightness','0.0017 × Sun'],['Known planets','Proxima b (habitable zone)']],
  desc:'The closest star to the Sun. It is too dim to see with the naked eye, yet it hosts an Earth-mass planet in the zone where liquid water could exist.',wiki:'Proxima_Centauri',q:'proxima centauri hubble'},
 {id:'acen',name:'Alpha Centauri A',kind:'Sun-like star (G2V)',col:'#fff1c9',sz:90,ly:4.37,dir:[.55,-.3,.8],
  facts:[['Distance','4.37 light-years'],['Mass','1.1 × Sun'],['Surface temp','~5,500 °C'],['Brightness','1.5 × Sun'],['System','Triple star with B and Proxima']],
  desc:'The brightest member of our nearest star system and almost a twin of the Sun. Its partner Alpha Centauri B orbits it every 80 years.',wiki:'Alpha_Centauri',q:'alpha centauri'},
 {id:'sirius',name:'Sirius',kind:'White main-sequence star (A1V)',col:'#cfe0ff',sz:130,ly:8.6,dir:[-.7,-.15,.6],
  facts:[['Distance','8.6 light-years'],['Mass','2.06 × Sun'],['Surface temp','~9,700 °C'],['Brightness','25 × Sun'],['Companion','Sirius B, a white dwarf']],
  desc:'The brightest star in Earth’s night sky, nicknamed the Dog Star. Its tiny companion, Sirius B, packs about the Sun’s mass into a ball the size of Earth.',wiki:'Sirius',q:'sirius star'},
 {id:'vega',name:'Vega',kind:'White main-sequence star (A0V)',col:'#d8e6ff',sz:110,ly:25,dir:[-.2,.7,-.65],
  facts:[['Distance','25 light-years'],['Mass','2.1 × Sun'],['Surface temp','~9,300 °C'],['Brightness','40 × Sun'],['Spin','Once every ~12.5 hours']],
  desc:'Once the reference point for the stellar brightness scale. Vega spins so fast it bulges at the equator, and about 12,000 years from now it will be our pole star again.',wiki:'Vega',q:'vega star'},
 {id:'polaris',name:'Polaris',kind:'Yellow supergiant (F7Ib), Cepheid variable',col:'#fff4d6',sz:120,ly:430,dir:[.05,1,.05],
  facts:[['Distance','~430 light-years'],['Mass','~5.4 × Sun'],['Radius','~46 × Sun'],['Brightness','~1,260 × Sun'],['Known as','The North Star']],
  desc:'Sits almost exactly above Earth’s North Pole, so it barely moves across the sky. Navigators have used it for centuries. It is actually a triple-star system.',wiki:'Polaris',q:'polaris star'},
 {id:'betelgeuse',name:'Betelgeuse',kind:'Red supergiant (M1–2 Ia)',col:'#ff9a5c',sz:200,ly:550,dir:[-.45,.25,-.85],
  facts:[['Distance','~550 light-years'],['Radius','~760 × Sun'],['Surface temp','~3,300 °C'],['Mass','~15–20 × Sun'],['Fate','Supernova, within ~100,000 yrs']],
  desc:'Orion’s red shoulder. Placed where the Sun is, its surface would reach past Mars. Its "Great Dimming" in 2019–2020 was caused by a huge cloud of dust it ejected.',wiki:'Betelgeuse',q:'betelgeuse'},
 {id:'rigel',name:'Rigel',kind:'Blue supergiant (B8 Ia)',col:'#a9c8ff',sz:190,ly:860,dir:[-.35,-.4,-.85],
  facts:[['Distance','~860 light-years'],['Mass','~21 × Sun'],['Surface temp','~11,800 °C'],['Brightness','~120,000 × Sun'],['Constellation','Orion (left foot)']],
  desc:'One of the most luminous stars visible to the naked eye. Rigel lights up the nearby Witch Head Nebula with its blue-white glare.',wiki:'Rigel',q:'rigel orion'},
];
const GALAXY=[
 {id:'sgra',name:'Sagittarius A*',kind:'Supermassive black hole',col:'#ffcf8a',
  facts:[['Mass','~4.3 million × Sun'],['Distance','~26,700 light-years'],['Location','Centre of the Milky Way'],['First image','Event Horizon Telescope, 2022']],
  desc:'The black hole at the heart of our galaxy. Astronomers proved it is there by tracking stars that whip around an invisible mass. The 2020 Nobel Prize in Physics went to that work.',wiki:'Sagittarius_A*',q:'sagittarius a* black hole'},
 {id:'milky',name:'Milky Way',kind:'Barred spiral galaxy — our home',col:'#e6dcff',
  facts:[['Diameter','~100,000 light-years'],['Stars','100–400 billion'],['Sun’s distance from centre','~26,000 light-years'],['Sun’s orbit','~230 million years'],['Age','~13.6 billion years']],
  desc:'Our home galaxy, a barred spiral. The Sun sits in a minor arm, the Orion Spur, about halfway out from the centre. On dark nights we see the disc edge-on as a glowing band.',wiki:'Milky_Way',q:'milky way'},
 {id:'andromeda',name:'Andromeda Galaxy',kind:'Spiral galaxy (M31)',col:'#f2e3ff',
  facts:[['Distance','~2.5 million light-years'],['Diameter','~220,000 light-years'],['Stars','~1 trillion'],['Approaching at','~110 km/s'],['Visible to','Naked eye, from dark sites']],
  desc:'The nearest large galaxy and the most distant thing most people can see without a telescope. It is falling toward us. The two galaxies may merge billions of years from now.',wiki:'Andromeda_Galaxy',q:'andromeda galaxy'},
 {id:'belt',name:'Asteroid Belt',kind:'Region of rocky bodies',col:'#c9b9a0',
  facts:[['Location','Between Mars and Jupiter'],['Distance from Sun','2.2–3.2 AU'],['Largest body','Ceres (dwarf planet, 940 km)'],['Total mass','~3% of the Moon']],
  desc:'Millions of rocky fragments left over from the Solar System’s formation. Jupiter’s gravity kept them from forming a planet. They are so spread out that spacecraft cross the belt easily.',wiki:'Asteroid_belt',q:'asteroid belt ceres vesta'},
];

/* ---------- real ephemeris ---------- */
const D2R=Math.PI/180,EPS=23.4392911*D2R,cE=Math.cos(EPS),sE=Math.sin(EPS);

const texCache={};
function makeTex(name,W=512,H=256){
 if(texCache[name])return texCache[name];
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d'),im=g.createImageData(W,H),d=im.data,f=SHADERS[name];
 for(let j=0;j<H;j++){const lat=(.5-j/H)*Math.PI,cl=Math.cos(lat),sy=Math.sin(lat);
  for(let i=0;i<W;i++){const lon=i/W*Math.PI*2,x=cl*Math.cos(lon),z=cl*Math.sin(lon);const c=f(x+2,sy+2,z+2,lat),k=(j*W+i)*4;
   d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=c.length>3?c[3]:255}}
 if(name==='mercury'||name==='moon')craters(d,W,H,name==='moon'?140:220);

}

 for(let c=0;c<n;c++){const cx=rnd()*W,cy=H*.12+rnd()*H*.76,r=1.5+Math.pow(rnd(),3)*16;
  for(let y=-r*1.3;y<r*1.3;y++)for(let x=-r*1.3;x<r*1.3;x++){const q=Math.hypot(x,y)/r;if(q>1.3)continue;

   const f=q<1?.78+.12*q:1.12-(q-1)*.4;for(let t=0;t<3;t++)d[k+t]=Math.min(255,d[k+t]*f)}}}
